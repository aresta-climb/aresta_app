name: frontend
description: "Aplicativo de escalada para centralizar informações de picos"
publish_to: 'none'

version: 0.6.3-dev+103

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  protobuf: ^6.0.0
  http: ^1.2.0
  http_parser: ^4.0.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  markdown: any
  crypto: any
  mobile_scanner: ^7.2.0
  archive: ^4.0.9
  fuzzy: ^0.5.1
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.7
  package_info_plus: ^10.1.0
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1
  firebase_remote_config: ^7.0.1
  firebase_performance: ^0.12.1
  yaml: ^3.1.3
  google_maps_flutter: ^2.19.0
  google_maps_flutter_ios_sdk9: ^2.19.0
  feedback: ^3.2.0
  workmanager: ^0.10.0
  uuid: ^4.5.3
  path: ^1.9.1
  path_drawing: ^1.0.1
  device_info_plus: ^13.1.0
  connectivity_plus: ^7.1.1
  google_fonts: ^9.0.0
  geolocator: ^14.0.3
  firebase_app_check: ^0.5.1
  flutter_local_notifications: ^22.3.0
  fixnum: ^1.1.0
  flutter_svg: ^2.3.0
  app_links: ^7.2.1
  flutter_image_compress: ^2.5.1
  sqflite: ^2.4.1
  share_plus: ^13.3.1
  sentry_flutter: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  app_links_platform_interface: any
  path_provider_platform_interface: any
  plugin_platform_interface: any
  url_launcher_platform_interface: any
  sqflite_common_ffi: ^2.3.4+4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5
  sentry_dart_plugin: ^3.4.0
flutter:
  uses-material-design: true
  assets:
    - assets/team/
    - legal/repo/public/docs/termos-de-uso.md
    - legal/repo/public/docs/politica-de-privacidade.md
    - assets/logo_app.png
    - assets/logo_app_app_details2.png
    - assets/logo_in_app.jpg
    - assets/logo_splash.png
    - assets/logo_app_trace.svg
    - assets/preload/
    - assets/preload/thumbnails/

  fonts:
    - family: BebasNeue
      fonts:
        - asset: fonts/BebasNeue-Regular.ttf
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: fonts/Montserrat-Thin.ttf
          weight: 300

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo_app.png"
  adaptive_icon_background: "assets/logo_app.png"
  adaptive_icon_foreground: "assets/logo_app.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/logo_splash.png"
  android: true
  ios: true
  android_12:
    image: "assets/logo_splash.png"
    icon_background_color: "#ffffff"


sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: aresta-app
  org: aresta-climb
