name: frontend
description: "Aplicativo de escalada para centralizar informações de picos"
publish_to: 'none'

version: 0.0.26-dev+45

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  protobuf: ^6.0.0
  http: ^1.2.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  markdown: any
  crypto: any
  mobile_scanner: ^7.2.0
  archive: ^4.0.9
  file_picker: ^12.0.0-beta.5
  fuzzy: ^0.5.1
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.7
  package_info_plus: ^10.1.0
  firebase_core: ^4.10.0
  firebase_analytics: ^12.4.2
  firebase_crashlytics: ^5.2.3
  firebase_remote_config: ^6.5.2
  firebase_performance: ^0.11.4+2
  yaml: ^3.1.3
  google_maps_flutter: ^2.17.1
  feedback: ^3.2.0
  workmanager: ^0.9.0+3
  uuid: ^4.5.3
  path: ^1.9.1
  device_info_plus: ^13.1.0
  connectivity_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  path_provider_platform_interface: any
  plugin_platform_interface: any
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5
flutter:
  uses-material-design: true
  assets:
    - legal/repo/TERMOS_DE_USO_ARESTA_CLIMB.md
    - legal/repo/POLITICA_DE_PRIVACIDADE_ARESTA_CLIMB.md
    - assets/logo_app.png
    - assets/preload/
    - assets/preload/thumbnails/

  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: fonts/Montserrat-Thin.ttf
          weight: 300

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo_app.png"
  adaptive_icon_background: "assets/logo_app.png"
  adaptive_icon_foreground: "assets/logo_app.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/logo_splash.png"
  android: true
  ios: true
  android_12:
    image: "assets/logo_splash.png"
    icon_background_color: "#ffffff"
