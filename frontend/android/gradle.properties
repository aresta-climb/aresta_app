org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableR8.fullMode=true
# Habilita explicitamente a redução otimizada de recursos integrada ao R8 para conformidade com o Android Vitals
android.r8.optimizedResourceShrinking=true
kotlin.jvm.target.validation.mode=warning

# Desativa o observador contínuo de arquivos do Gradle (VFS watch) para evitar erros de 'Already watching path' em CI/CD
org.gradle.vfs.watch=false

# Habilita o suporte a Kotlin embutido do AGP 9 para compilar e empacotar corretamente classes de bibliotecas (ex: Firebase)
android.builtInKotlin=true

# Mantém a DSL clássica necessária para compatibilidade com o plugin Gradle do Flutter (evita ClassCastException em AbstractAppExtension)
android.newDsl=false
