name: Update Legal Terms

on:
  repository_dispatch:
    types: [update-legal-terms]
  workflow_dispatch:

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To commit
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: 'recursive'

      - name: Update Legal Repo Submodule
        run: |
          git submodule update --remote frontend/legal/repo

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend/tool/legal_updater/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: |
          cd frontend/tool/legal_updater
          dart pub get

      - name: Run Bump Script
        run: |
          cd frontend/tool/legal_updater
          dart run bin/update_legal_version.dart ../../legal/repo ../../lib/constants/legal_version.g.dart

      - name: Commit changes
        run: |
          git config --global user.name "aresta-climb-bot[bot]"
          git config --global user.email "281080576+aresta-climb-bot[bot]@users.noreply.github.com"
          git add frontend/legal/repo frontend/lib/constants/legal_version.g.dart
          git commit -m "chore: auto-update legal terms and version" || echo "No changes to commit"
          git push
