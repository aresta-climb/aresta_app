name: Unified App Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo de incremento de versão'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: 'patch'
      custom_version:
        description: 'Versão customizada (obrigatório se bump_type for custom, ex: 1.0.0)'
        required: false
        type: string
        default: ''
      deploy_android:
        description: 'Deploy para Android?'
        required: true
        type: boolean
        default: true
      deploy_ios:
        description: 'Deploy para iOS?'
        required: true
        type: boolean
        default: true
      enviar_para_producao:
        description: 'Enviar para Produção nas lojas (Google Play e App Store)?'
        required: true
        type: boolean
        default: true
      release_notes:
        description: 'Notas de lançamento (máx. 500 caracteres)'
        required: true
        type: string

jobs:
  prepare_release:
    name: Prepare Release Version
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para fazer commit e criar tags
    outputs:
      tag_name: ${{ steps.bump.outputs.tag_name }}
      versao_release: ${{ steps.bump.outputs.versao_release }}
      novo_build: ${{ steps.bump.outputs.novo_build }}
    steps:
      - name: Validar Notas de Lançamento (Fail-Early)
        env:
          NOTAS_LANCAMENTO: ${{ inputs.release_notes }}
        run: |
          TAMANHO=${#NOTAS_LANCAMENTO}
          echo "Validando tamanho das notas de lançamento: $TAMANHO caracteres."
          if [ $TAMANHO -eq 0 ]; then
            echo "::error::As notas de lançamento são obrigatórias e não podem estar vazias."
            exit 1
          fi
          if [ $TAMANHO -gt 500 ]; then
            echo "::error::As notas de lançamento excedem o limite de 500 caracteres da Play Store (tamanho atual: $TAMANHO). Reduza o texto antes de lançar."
            exit 1
          fi
          echo "Notas de lançamento validadas com sucesso."

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: 'recursive'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Validate Flutter Analyze (Zero Warnings/Errors)
        working-directory: ./frontend
        run: |
          flutter pub get
          flutter analyze --fatal-infos --fatal-warnings

      - name: Calcular Versão de Release
        id: bump
        run: |
          cd frontend
          dart run tool/release_tools/calcular_versao_release.dart \
            --tipo "${{ inputs.bump_type }}" \
            --custom "${{ inputs.custom_version }}" \
            --pubspec pubspec.yaml \
            --exportar-env "$GITHUB_OUTPUT"
          cd ..

      - name: Injetar Versão Oficial e Atualizar Recursos
        run: |
          FINAL_VERSION="${{ steps.bump.outputs.versao_completa }}"
          TAG_NAME="${{ steps.bump.outputs.tag_name }}"
          PUBSPEC="frontend/pubspec.yaml"
          
          echo "Final target version: $FINAL_VERSION"
          echo "Target tag: $TAG_NAME"
          
          cd frontend
          dart run tool/release_tools/atualizar_versao_pubspec.dart pubspec.yaml "$FINAL_VERSION"
          flutter pub get
          dart tool/sync_preload.dart
          cd ..

          # Atualiza os termos legais e recalcula a versão dos termos
          git submodule update --remote frontend/legal/repo
          cd frontend/tool/legal_updater
          dart pub get
          dart run bin/update_legal_version.dart ../../legal/repo ../../lib/constants/legal_version.g.dart
          cd ../../..
          
          # Configura a identidade do robô no git
          git config --global user.name "aresta-climb-bot[bot]"
          git config --global user.email "281080576+aresta-climb-bot[bot]@users.noreply.github.com"
          
          DEPLOY_MSG=""
          if [ "${{ inputs.deploy_android }}" == "true" ] && [ "${{ inputs.deploy_ios }}" == "true" ]; then
            DEPLOY_MSG="Android e iOS"
          elif [ "${{ inputs.deploy_android }}" == "true" ]; then
            DEPLOY_MSG="só Android"
          elif [ "${{ inputs.deploy_ios }}" == "true" ]; then
            DEPLOY_MSG="só iOS"
          else
            DEPLOY_MSG="nenhuma plataforma"
          fi
          
          # Commita as alterações
          git add $PUBSPEC frontend/assets/preload/ frontend/legal/repo frontend/lib/constants/legal_version.g.dart
          git commit -m "Lançar versão $FINAL_VERSION nas lojas de aplicativo ($DEPLOY_MSG)"
          
          # Cria a tag apontando para este exato commit
          git tag $TAG_NAME
          
          # Envia tudo de volta para a branch que chamou a esteira (geralmente main)
          git push origin HEAD
          git push origin $TAG_NAME

      - name: Iniciar Ciclo de Desenvolvimento Posterior
        run: |
          RELEASE_VER="${{ steps.bump.outputs.versao_release }}"
          RELEASE_BUILD="${{ steps.bump.outputs.novo_build }}"
          PUBSPEC="frontend/pubspec.yaml"
          
          cd frontend
          DEV_VERSION=$(dart run tool/release_tools/calcular_proximo_dev.dart "$RELEASE_VER" --build "$RELEASE_BUILD" --formato completo)
          echo "Setting version to dev mode: $DEV_VERSION"
          dart run tool/release_tools/atualizar_versao_pubspec.dart pubspec.yaml "$DEV_VERSION"
          cd ..
          
          git add $PUBSPEC
          git commit -m "chore: iniciar ciclo de desenvolvimento ($DEV_VERSION)"
          git push origin HEAD

  build_android:
    name: Build Android
    needs: prepare_release
    if: ${{ inputs.deploy_android }}
    uses: ./.github/workflows/build_android.yml
    with:
      tag_name: ${{ needs.prepare_release.outputs.tag_name }}
      enviar_para_producao: ${{ inputs.enviar_para_producao }}
      release_notes: ${{ inputs.release_notes }}
    secrets: inherit

  build_ios:
    name: Build iOS
    needs: prepare_release
    if: ${{ inputs.deploy_ios }}
    uses: ./.github/workflows/build_ios.yml
    with:
      tag_name: ${{ needs.prepare_release.outputs.tag_name }}
    secrets: inherit

  submit_ios_review:
    name: Submeter iOS para Revisão
    needs: [prepare_release, build_ios]
    if: ${{ inputs.deploy_ios && inputs.enviar_para_producao }}
    uses: ./.github/workflows/submit_ios_review.yml
    with:
      tag_name: ${{ needs.prepare_release.outputs.tag_name }}
      versao_release: ${{ needs.prepare_release.outputs.versao_release }}
      novo_build: ${{ needs.prepare_release.outputs.novo_build }}
      release_notes: ${{ inputs.release_notes }}
    secrets: inherit
