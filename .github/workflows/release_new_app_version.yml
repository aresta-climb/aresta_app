name: Unified App Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo de incremento de versão'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: 'patch'
      custom_version:
        description: 'Versão customizada (obrigatório se bump_type for custom, ex: 1.0.0)'
        required: false
        type: string
        default: ''
      deploy_android:
        description: 'Deploy para Android?'
        required: true
        type: boolean
        default: true
      deploy_ios:
        description: 'Deploy para iOS?'
        required: true
        type: boolean
        default: true
      enviar_para_producao:
        description: 'Enviar para Produção nas lojas (Google Play e App Store)?'
        required: true
        type: boolean
        default: true
      publicar_nas_lojas:
        description: 'Cortar versão no Git e publicar nas lojas/Sentry/Crashlytics? (desmarque para teste interno de CI)'
        required: true
        type: boolean
        default: true
      executar_robo_caotico:
        description: 'Executar campanha de fuzzing do Robô Caótico (5 min)?'
        required: true
        type: boolean
        default: true
      release_notes:
        description: 'Notas de lançamento (máx. 500 caracteres)'
        required: true
        type: string

jobs:
  prepare_release:
    name: Validar Testes e Preparar Versão Candidata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.bump.outputs.tag_name }}
      versao_release: ${{ steps.bump.outputs.versao_release }}
      versao_completa: ${{ steps.bump.outputs.versao_completa }}
      novo_build: ${{ steps.bump.outputs.novo_build }}
    steps:
      - name: Validar Notas de Lançamento (Fail-Early)
        env:
          NOTAS_LANCAMENTO: ${{ inputs.release_notes }}
        run: |
          TAMANHO=${#NOTAS_LANCAMENTO}
          echo "Validando tamanho das notas de lançamento: $TAMANHO caracteres."
          if [ $TAMANHO -eq 0 ]; then
            echo "::error::As notas de lançamento são obrigatórias e não podem estar vazias."
            exit 1
          fi
          if [ $TAMANHO -gt 500 ]; then
            echo "::error::As notas de lançamento excedem o limite de 500 caracteres da Play Store (tamanho atual: $TAMANHO). Reduza o texto antes de lançar."
            exit 1
          fi
          echo "Notas de lançamento validadas com sucesso."

      - name: Gerar GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout do Código
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: 'recursive'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Validar Flutter Analyze (Zero Warnings/Errors)
        working-directory: ./frontend
        run: |
          flutter pub get
          flutter analyze --fatal-infos --fatal-warnings

      - name: Executar Suíte de Testes (TDD & Regressão)
        working-directory: ./frontend
        run: |
          flutter test

      - name: Executar Campanha do Robô Caótico (5 min)
        if: ${{ inputs.executar_robo_caotico }}
        working-directory: ./frontend
        run: |
          flutter test test/caos/robo_caotico_exploratorio_test.dart --dart-define=DURACAO_CAMPANHA_CAOS_SEGUNDOS=300 --dart-define=REPORTAR_SENTRY_CAOS=true --timeout=10m

      - name: Publicar Receitas de Crash do Robô Caótico
        if: ${{ failure() && inputs.executar_robo_caotico }}
        uses: actions/upload-artifact@v7
        with:
          name: receitas-crash-robo-caotico
          path: frontend/test/caos/caminhos_regressao/*.json
          if-no-files-found: ignore

      - name: Calcular Versão de Release
        id: bump
        run: |
          cd frontend
          dart run tool/release_tools/calcular_versao_release.dart \
            --tipo "${{ inputs.bump_type }}" \
            --custom "${{ inputs.custom_version }}" \
            --pubspec pubspec.yaml \
            --exportar-env "$GITHUB_OUTPUT"
          cd ..

      - name: Preparar Pacote Candidato de Versão, Preload e Termos Legais (Sem Push no Git)
        run: |
          FINAL_VERSION="${{ steps.bump.outputs.versao_completa }}"
          TAG_NAME="${{ steps.bump.outputs.tag_name }}"
          echo "Versão candidata preparada: $FINAL_VERSION ($TAG_NAME)"

          cd frontend
          dart run tool/release_tools/atualizar_versao_pubspec.dart pubspec.yaml "$FINAL_VERSION"
          flutter pub get
          dart tool/sync_preload.dart
          cd ..

          git submodule update --remote frontend/legal/repo
          LEGAL_SHA=$(git -C frontend/legal/repo rev-parse HEAD)
          cd frontend/tool/legal_updater
          dart pub get
          dart run bin/update_legal_version.dart ../../legal/repo ../../lib/constants/legal_version.g.dart
          cd ../../..

          mkdir -p pacote-candidato-release
          tar -czf pacote-candidato-release/candidato.tar.gz \
            frontend/pubspec.yaml \
            frontend/lib/constants/legal_version.g.dart \
            frontend/assets/preload
          echo "$LEGAL_SHA" > pacote-candidato-release/legal_submodule_sha.txt

      - name: Publicar Pacote Candidato para Compilação Multiplataforma
        uses: actions/upload-artifact@v7
        with:
          name: pacote-candidato-release
          path: pacote-candidato-release/
          retention-days: 5

  build_e_smoke_android:
    name: Build e Smoke Test Android (KVM)
    needs: prepare_release
    if: ${{ inputs.deploy_android }}
    uses: ./.github/workflows/build_android.yml
    with:
      etapa: 'build_e_smoke'
      ref_git: ${{ github.sha }}
      tag_name: ${{ needs.prepare_release.outputs.tag_name }}
      enviar_para_producao: ${{ inputs.enviar_para_producao }}
      release_notes: ${{ inputs.release_notes }}
    secrets: inherit

  build_e_smoke_ios:
    name: Build e Smoke Test iOS (Simulator + IPA)
    needs: prepare_release
    if: ${{ inputs.deploy_ios }}
    uses: ./.github/workflows/build_ios.yml
    with:
      etapa: 'build_e_smoke'
      ref_git: ${{ github.sha }}
      tag_name: ${{ needs.prepare_release.outputs.tag_name }}
    secrets: inherit

  cortar_versao:
    name: Cortar Versão e Tag Atômica no Git
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [prepare_release, build_e_smoke_android, build_e_smoke_ios]
    if: >-
      always() &&
      inputs.publicar_nas_lojas &&
      (inputs.deploy_android || inputs.deploy_ios) &&
      needs.prepare_release.result == 'success' &&
      (!inputs.deploy_android || needs.build_e_smoke_android.result == 'success') &&
      (!inputs.deploy_ios || needs.build_e_smoke_ios.result == 'success')
    steps:
      - name: Gerar GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout da Branch Alvo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: 'recursive'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Baixar Pacote Candidato Aprovado
        uses: actions/download-artifact@v8
        with:
          name: pacote-candidato-release
          path: pacote-candidato-release

      - name: Aplicar Versão Aprovada, Criar Tag e Avançar Ciclo Dev Atômico
        run: |
          FINAL_VERSION="${{ needs.prepare_release.outputs.versao_completa }}"
          RELEASE_VER="${{ needs.prepare_release.outputs.versao_release }}"
          RELEASE_BUILD="${{ needs.prepare_release.outputs.novo_build }}"
          TAG_NAME="${{ needs.prepare_release.outputs.tag_name }}"
          PUBSPEC="frontend/pubspec.yaml"

          tar -xzf pacote-candidato-release/candidato.tar.gz
          LEGAL_SHA=$(cat pacote-candidato-release/legal_submodule_sha.txt | tr -d '[:space:]')
          git -C frontend/legal/repo fetch origin
          git -C frontend/legal/repo checkout "$LEGAL_SHA"

          git config --global user.name "aresta-climb-bot[bot]"
          git config --global user.email "281080576+aresta-climb-bot[bot]@users.noreply.github.com"

          DEPLOY_MSG=""
          if [ "${{ inputs.deploy_android }}" == "true" ] && [ "${{ inputs.deploy_ios }}" == "true" ]; then
            DEPLOY_MSG="Android e iOS"
          elif [ "${{ inputs.deploy_android }}" == "true" ]; then
            DEPLOY_MSG="só Android"
          elif [ "${{ inputs.deploy_ios }}" == "true" ]; then
            DEPLOY_MSG="só iOS"
          else
            DEPLOY_MSG="nenhuma plataforma"
          fi

          git add "$PUBSPEC" frontend/assets/preload/ frontend/legal/repo frontend/lib/constants/legal_version.g.dart
          git commit -m "Lançar versão $FINAL_VERSION nas lojas de aplicativo ($DEPLOY_MSG)"
          git tag "$TAG_NAME"

          cd frontend
          DEV_VERSION=$(dart run tool/release_tools/calcular_proximo_dev.dart "$RELEASE_VER" --build "$RELEASE_BUILD" --formato completo)
          echo "Configurando versão de desenvolvimento: $DEV_VERSION"
          dart run tool/release_tools/atualizar_versao_pubspec.dart pubspec.yaml "$DEV_VERSION"
          cd ..

          git add "$PUBSPEC"
          git commit -m "chore: iniciar ciclo de desenvolvimento ($DEV_VERSION)"

          git push --atomic origin HEAD "refs/tags/$TAG_NAME"

  publicar_android:
    name: Publicar Android (Sentry, Crashlytics e Google Play)
    needs: [prepare_release, build_e_smoke_android, cortar_versao]
    if: ${{ inputs.publicar_nas_lojas && inputs.deploy_android }}
    uses: ./.github/workflows/build_android.yml
    with:
      etapa: 'publicar'
      ref_git: ${{ needs.prepare_release.outputs.tag_name }}
      tag_name: ${{ needs.prepare_release.outputs.tag_name }}
      enviar_para_producao: ${{ inputs.enviar_para_producao }}
      release_notes: ${{ inputs.release_notes }}
    secrets: inherit

  publicar_ios:
    name: Publicar iOS (Sentry, Crashlytics e TestFlight)
    needs: [prepare_release, build_e_smoke_ios, cortar_versao]
    if: ${{ inputs.publicar_nas_lojas && inputs.deploy_ios }}
    uses: ./.github/workflows/build_ios.yml
    with:
      etapa: 'publicar'
      ref_git: ${{ needs.prepare_release.outputs.tag_name }}
      tag_name: ${{ needs.prepare_release.outputs.tag_name }}
    secrets: inherit

  submit_ios_review:
    name: Submeter iOS para Revisão
    needs: [prepare_release, cortar_versao, publicar_ios]
    if: ${{ inputs.publicar_nas_lojas && inputs.deploy_ios && inputs.enviar_para_producao }}
    uses: ./.github/workflows/submit_ios_review.yml
    with:
      tag_name: ${{ needs.prepare_release.outputs.tag_name }}
      versao_release: ${{ needs.prepare_release.outputs.versao_release }}
      novo_build: ${{ needs.prepare_release.outputs.novo_build }}
      release_notes: ${{ inputs.release_notes }}
    secrets: inherit
