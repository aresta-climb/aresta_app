name: iOS Release Sub-Workflow

on:
  workflow_call:
    inputs:
      etapa:
        description: 'Etapa a executar: build_e_smoke ou publicar'
        required: false
        type: string
        default: 'build_e_smoke'
      ref_git:
        description: 'Commit SHA ou tag para checkout'
        required: false
        type: string
        default: ''
      tag_name:
        description: 'A tag do git para construir'
        required: true
        type: string

jobs:
  build_e_smoke:
    name: Compilar IPA e Validar Smoke iOS (Simulator)
    if: ${{ inputs.etapa == 'build_e_smoke' }}
    runs-on: macos-latest
    timeout-minutes: 50

    steps:
      - name: Gerar GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout do Repositório
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref_git != '' && inputs.ref_git || inputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: 'recursive'

      - name: Baixar Pacote Candidato de Release
        uses: actions/download-artifact@v8
        with:
          name: pacote-candidato-release
          path: pacote-candidato-release

      - name: Aplicar Versão Candidata, Preload e Termos Legais
        run: |
          tar -xzf pacote-candidato-release/candidato.tar.gz
          LEGAL_SHA=$(cat pacote-candidato-release/legal_submodule_sha.txt | tr -d '[:space:]')
          git -C frontend/legal/repo fetch origin
          git -C frontend/legal/repo checkout "$LEGAL_SHA"

      - name: Selecionar Versão do Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Cache de Swift Package Manager
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache de CocoaPods
        uses: actions/cache@v6
        with:
          path: frontend/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Instalar Certificado Apple e Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_MOBILE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "action_runner_password"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain
          security default-keychain -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin <<< $(security cms -D -i $PP_PATH))

          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "DEVELOPMENT_TEAM_ID=$TEAM_ID" >> $GITHUB_ENV

      - name: Obter dependências do Flutter
        working-directory: frontend
        run: flutter pub get

      - name: Configurar Projeto iOS para Assinatura Manual em CI
        working-directory: ./frontend/ios
        run: |
          cp Flutter/Release.xcconfig "$RUNNER_TEMP/Release.xcconfig.bak"
          echo "CODE_SIGN_STYLE=Manual" >> Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=Apple Distribution" >> Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=${{ env.DEVELOPMENT_TEAM_ID }}" >> Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER=${{ env.PROVISIONING_PROFILE_UUID }}" >> Flutter/Release.xcconfig

          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.escalada.croquis</key>
              <string>${{ env.PROVISIONING_PROFILE_UUID }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Compilar IPA Oficial do iOS (Puro da Loja)
        working-directory: frontend
        run: |
          flutter build ipa --release --obfuscate --split-debug-info=build/symbols --export-options-plist=ios/ExportOptions.plist

      - name: Empacotar Tarball de Staging Oficial do iOS antes do Build de Simulator
        run: |
          tar -czf ios-staging-archive.tar.gz \
            frontend/build/ios/ipa \
            frontend/build/ios/archive/Runner.xcarchive/dSYMs \
            frontend/build/symbols

      - name: Compilar App Descartável para iOS Simulator e Executar Smoke Test Pós-Build
        working-directory: frontend
        run: |
          cp "$RUNNER_TEMP/Release.xcconfig.bak" ios/Flutter/Release.xcconfig
          flutter build ios --simulator \
            --target=lib/services/smoke_ci/main_smoke_ci.dart

          SIM_PLIST="build/ios/iphonesimulator/Runner.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$SIM_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$SIM_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" "$SIM_PLIST"
          codesign --force --sign - --timestamp=none build/ios/iphonesimulator/Runner.app

          DEVICE_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          candidatos = []
          for runtime, devs in data.items():
              if 'iOS' not in runtime:
                  continue
              for d in devs:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      candidatos.append((runtime, d['udid']))
          candidatos.sort(reverse=True)
          if not candidatos:
              sys.exit(1)
          print(candidatos[0][1])
          ")
          echo "Iniciando iOS Simulator UDID=$DEVICE_UDID..."
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          dart run tool/release_tools/smoke_test_pacote.dart \
            --plataforma ios \
            --ipa "$IPA_PATH" \
            --app-simulador build/ios/iphonesimulator/Runner.app \
            --pacote app.escalada.croquis \
            --saida-relatorio build/evidencia-smoke-ios.json

          xcrun simctl shutdown "$DEVICE_UDID" || true

      - name: Publicar Evidência do Smoke Test iOS
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-smoke-ios-${{ inputs.tag_name }}
          path: frontend/build/evidencia-smoke-ios.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload de Artefatos de Release iOS Aprovados (IPA, dSYMs e Símbolos Dart)
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-${{ inputs.tag_name }}
          path: ios-staging-archive.tar.gz
          retention-days: 90

  publicar:
    name: Publicar iOS (Sentry, Crashlytics e TestFlight)
    if: ${{ inputs.etapa == 'publicar' }}
    runs-on: macos-latest

    steps:
      - name: Gerar GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout da Tag Oficial
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: 'recursive'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Obter dependências do Flutter
        working-directory: frontend
        run: flutter pub get

      - name: Baixar Artefatos iOS Aprovados no Smoke Test
        uses: actions/download-artifact@v8
        with:
          name: ios-release-${{ inputs.tag_name }}
          path: .

      - name: Extrair Artefatos Aprovados
        run: tar -xzf ios-staging-archive.tar.gz

      - name: Validar e Fazer Upload de Símbolos para o Sentry (Fail-Fast)
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN não configurado nos secrets do GitHub! O build de release não pode ser publicado sem símbolos de desofuscação no Sentry."
            exit 1
          fi
          dart run sentry_dart_plugin

      - name: Upload de dSYMs e Símbolos para o Firebase Crashlytics
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        working-directory: frontend
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON não configurada."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > $GOOGLE_APPLICATION_CREDENTIALS

          if [ ! -d "build/ios/archive/Runner.xcarchive/dSYMs" ]; then
            echo "::error::Diretório build/ios/archive/Runner.xcarchive/dSYMs não encontrado."
            exit 1
          fi

          UPLOAD_SYMBOLS=$(find ios ~/Library/Developer/Xcode/DerivedData -name "upload-symbols" -type f 2>/dev/null | head -n 1)
          if [ -z "$UPLOAD_SYMBOLS" ]; then
            echo "upload-symbols não encontrado localmente. Baixando utilitário oficial do repositório do Firebase iOS SDK..."
            curl -sSL "https://github.com/firebase/firebase-ios-sdk/raw/main/Crashlytics/upload-symbols" -o /tmp/upload-symbols
            chmod +x /tmp/upload-symbols
            UPLOAD_SYMBOLS="/tmp/upload-symbols"
          else
            chmod +x "$UPLOAD_SYMBOLS"
          fi

          echo "Enviando dSYMs nativos para o Crashlytics via $UPLOAD_SYMBOLS..."
          "$UPLOAD_SYMBOLS" -gsp ios/Runner/GoogleService-Info.plist -p ios build/ios/archive/Runner.xcarchive/dSYMs

      - name: Upload para App Store Connect (TestFlight)
        env:
          API_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        working-directory: frontend
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo -n "$API_KEY" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          IPA_PATH=$(find build/ios/ipa -name "*.ipa")
          echo "Fazendo upload do arquivo: $IPA_PATH"

          set +e
          UPLOAD_OK=0
          for TENTATIVA in 1 2 3; do
            echo "Tentativa $TENTATIVA de upload para o TestFlight..."
            ALTOOL_OUT=$(xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --apple-id "6776467893" --bundle-id "app.escalada.croquis" 2>&1)
            ALTOOL_RC=$?
            echo "$ALTOOL_OUT"
            if [ $ALTOOL_RC -eq 0 ] || echo "$ALTOOL_OUT" | grep -qE "Redundant Binary Upload|already been uploaded"; then
              echo "Upload do IPA concluído/registrado na tentativa $TENTATIVA!"
              UPLOAD_OK=1
              break
            fi
            echo "::warning::Falha transitória da Apple ContentDelivery na tentativa $TENTATIVA (rc=$ALTOOL_RC). Aguardando 25s antes de retentar..."
            sleep 25
          done
          set -e
          if [ $UPLOAD_OK -ne 1 ]; then
            echo "::error::Não foi possível concluir o upload do IPA para o TestFlight após 3 tentativas."
            exit 1
          fi
