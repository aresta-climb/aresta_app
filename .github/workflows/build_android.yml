name: Android Release Sub-Workflow 

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'A tag do git para construir'
        required: true
        type: string
      android_track:
        description: 'Faixa do Google Play'
        required: false
        type: string
        default: 'internal,production'

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          

      - name: Get Flutter Packages
        working-directory: ./frontend
        run: flutter pub get

      - name: Decode Keystore
        working-directory: ./frontend/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 -d > upload-keystore.jks

      - name: Build AAB
        working-directory: ./frontend
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          STORE_FILE: upload-keystore.jks
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Package Native Debug Symbols
        working-directory: ./frontend
        run: |
          SRC_DIR="build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib"
          if [ ! -d "$SRC_DIR" ]; then
            SRC_DIR="build/app/intermediates/merged_native_libs/release/out/lib"
          fi
          if [ ! -d "$SRC_DIR" ]; then
            SRC_DIR="build/app/intermediates/stripped_native_libs/release/out/lib"
          fi
          
          echo "Buscando bibliotecas nativas em: $SRC_DIR"
          mkdir -p build/native-debug-symbols
          DEST_ZIP="$(pwd)/build/native-debug-symbols/native-debug-symbols.zip"
          if [ -d "$SRC_DIR" ]; then
            cd "$SRC_DIR"
            zip -r "$DEST_ZIP" ./*
            cd - > /dev/null
            echo "Arquivo de símbolos nativos criado com sucesso em: $DEST_ZIP"
          else
            echo "::warning::Diretório de bibliotecas nativas não encontrado. Criando arquivo de símbolos vazio."
            touch empty_symbol
            zip -j "$DEST_ZIP" empty_symbol
            rm empty_symbol
          fi

      - name: Upload Android Release Artifacts (AAB, Mappings, Símbolos Dart e Símbolos Nativos)
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ inputs.tag_name }}
          path: |
            frontend/build/app/outputs/bundle/release/*.aab
            frontend/build/app/outputs/mapping/release/
            frontend/build/symbols
            frontend/build/native-debug-symbols/native-debug-symbols.zip
          retention-days: 90

      - name: Upload Dart Symbols to Firebase Crashlytics
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        working-directory: ./frontend
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON não configurada."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > $GOOGLE_APPLICATION_CREDENTIALS
          if [ ! -d "build/symbols" ]; then
            echo "::error::Diretório build/symbols não encontrado."
            exit 1
          fi
          echo "Enviando símbolos Dart do Android para o Crashlytics..."
          npx --yes firebase-tools crashlytics:symbols:upload \
            --app="1:737982062809:android:e168a4e15cd353e1d5dec8" \
            build/symbols

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_STORE_CONFIG_JSON }}
          packageName: app.escalada.croquis
          releaseFiles: frontend/build/app/outputs/bundle/release/app-release.aab
          mappingFile: frontend/build/app/outputs/mapping/release/mapping.txt
          debugSymbols: frontend/build/native-debug-symbols/native-debug-symbols.zip
          tracks: ${{ inputs.android_track }}
          status: completed
