name: Android Release Sub-Workflow 

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'A tag do git para construir'
        required: true
        type: string

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
          


      - name: Get Flutter Packages
        working-directory: ./frontend
        run: flutter pub get

      - name: Decode Keystore
        working-directory: ./frontend/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 -d > upload-keystore.jks

      - name: Build AAB
        working-directory: ./frontend
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          STORE_FILE: upload-keystore.jks
          FEEDBACK_URL: ${{ secrets.FEEDBACK_EDGE_FUNCTION_URL }}
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_EDGE_FUNCTION_API_KEY }}
        run: flutter build appbundle --release --dart-define="FEEDBACK_EDGE_FUNCTION_URL=$FEEDBACK_URL" --dart-define="FEEDBACK_EDGE_FUNCTION_API_KEY=$FEEDBACK_API_KEY"


      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_STORE_CONFIG_JSON }}
          packageName: app.escalada.croquis
          releaseFiles: frontend/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
